<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaseFront 대시보드</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif; background: #f8fafc; color: #1e293b; }
.header { background: #0f172a; color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 18px; font-weight: 600; }
.header span { font-size: 13px; color: #94a3b8; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card { background: white; border-radius: 12px; padding: 20px; border: 1px solid #e2e8f0; }
.stat-card .label { font-size: 13px; color: #64748b; margin-bottom: 8px; }
.stat-card .value { font-size: 28px; font-weight: 700; color: #0f172a; }
.stat-card.urgent .value { color: #dc2626; }
.cases-table { background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; }
.cases-table h2 { padding: 16px 20px; font-size: 15px; border-bottom: 1px solid #e2e8f0; }
table { width: 100%; border-collapse: collapse; }
th { background: #f8fafc; padding: 12px 16px; text-align: left; font-size: 12px; color: #64748b; font-weight: 600; }
td { padding: 12px 16px; border-top: 1px solid #f1f5f9; font-size: 13px; }
tr:hover td { background: #f8fafc; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.badge.urgent { background: #fee2e2; color: #dc2626; }
.badge.normal { background: #f0fdf4; color: #16a34a; }
.badge.emergency { background: #fef3c7; color: #d97706; }
.loading { text-align: center; padding: 40px; color: #94a3b8; }
</style>
</head>
<body>

<div class="header">
  <h1>⚖️ CaseFront 대시보드</h1>
  <span id="lastUpdate">로딩 중...</span>
</div>

<div class="container">
  <div class="stats">
    <div class="stat-card">
      <div class="label">오늘 접수</div>
      <div class="value" id="statToday">-</div>
    </div>
    <div class="stat-card">
      <div class="label">이번 주 접수</div>
      <div class="value" id="statWeek">-</div>
    </div>
    <div class="stat-card">
      <div class="label">진행 중 세션</div>
      <div class="value" id="statActive">-</div>
    </div>
    <div class="stat-card urgent">
      <div class="label">오늘 긴급</div>
      <div class="value" id="statUrgent">-</div>
    </div>
  </div>

  <div class="cases-table">
    <h2>최근 접수 목록</h2>
    <table>
      <thead>
        <tr>
          <th>접수일시</th>
          <th>의뢰인</th>
          <th>사건 유형</th>
          <th>연락처</th>
          <th>긴급도</th>
          <th>요약</th>
        </tr>
      </thead>
      <tbody id="casesBody">
        <tr><td colspan="6" class="loading">로딩 중...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
async function loadStats() {
  const res = await fetch('/api/dashboard/stats');
  const data = await res.json();
  document.getElementById('statToday').textContent = data.today;
  document.getElementById('statWeek').textContent = data.thisWeek;
  document.getElementById('statActive').textContent = data.activeSessions;
  document.getElementById('statUrgent').textContent = data.urgentToday;
  document.getElementById('lastUpdate').textContent = '업데이트: ' + new Date().toLocaleTimeString('ko-KR');
}

async function loadCases() {
  const res = await fetch('/api/dashboard/cases?limit=50');
  const data = await res.json();
  const tbody = document.getElementById('casesBody');

  if (!data.cases || data.cases.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="loading">접수된 사건이 없습니다</td></tr>';
    return;
  }

  tbody.innerHTML = data.cases.map(c => {
    const summary = typeof c.summary === 'object' ? c.summary : {};
    const date = new Date(c.created_at).toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    const urgencyClass = c.urgency === 'emergency' ? 'emergency' : c.urgency === 'urgent' ? 'urgent' : 'normal';
    const urgencyText = c.urgency === 'emergency' ? '긴급' : c.urgency === 'urgent' ? '주의' : '일반';
    return `<tr>
      <td>${date}</td>
      <td>${c.client_name || '-'}</td>
      <td>${c.case_type || '-'}</td>
      <td>${c.client_phone || '-'}</td>
      <td><span class="badge ${urgencyClass}">${urgencyText}</span></td>
      <td>${summary.summary || '-'}</td>
    </tr>`;
  }).join('');
}

loadStats();
loadCases();
setInterval(() => { loadStats(); loadCases(); }, 30000);
</script>
</body>
</html>
